    <style>
      :root {
        --bg-primary: #050b1a;
        --bg-card: rgba(15, 25, 45, 0.55);
        --bg-card-hover: rgba(20, 35, 60, 0.7);
        --accent-blue: #3d9bff;
        --accent-cyan: #00d4ff;
        --text-primary: #ffffff;
        --text-secondary: #c4d3e8;
        --text-muted: #8a9bb5;
        --border-subtle: rgba(255, 255, 255, 0.12);
        --border-hover: rgba(61, 155, 255, 0.5);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        background: #050b1a;
        color: var(--text-primary);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      /* === VIDEO BACKGROUND (di luar frame, blur kuat seperti d'Alba) === */
      .bg-video-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -2;
        overflow: hidden;
        background: #050b1a;
      }

      .bg-video {
        position: absolute;
        top: 50%;
        left: 50%;
        /* Scale 1.15x supaya tepian video yg di-blur kuat tidak kelihatan */
        width: 115%;
        height: 115%;
        transform: translate(-50%, -50%);
        object-fit: cover;
        pointer-events: none;
        /* Blur tebal + sedikit redup → ini yang bikin "echo" di luar frame
           sama persis seperti foto blur di luar frame d'Alba */
        filter: blur(28px) brightness(0.55) saturate(110%);
      }

      /* Overlay tipis aja agar video tetap kelihatan vibrant di kiri-kanan container */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          180deg,
          rgba(5, 11, 26, 0.3) 0%,
          rgba(5, 11, 26, 0.15) 50%,
          rgba(5, 11, 26, 0.5) 100%
        );
        pointer-events: none;
        z-index: -1;
      }

      /* Subtle radial accent biru untuk DERMOND vibe */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            ellipse 80% 50% at 50% 0%,
            rgba(61, 155, 255, 0.18) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 60% 40% at 50% 100%,
            rgba(0, 212, 255, 0.1) 0%,
            transparent 60%
          );
        pointer-events: none;
        z-index: -1;
      }

      .container {
        max-width: 480px;
        margin: 24px auto;
        padding: 40px 22px 40px;
        position: relative;
        z-index: 1;
        border-radius: 28px;
        overflow: hidden;             /* WAJIB: supaya video di dalam ke-clip mengikuti border-radius */
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      /* Video DI DALAM frame: tajam, jelas, mengisi seluruh frame */
      .frame-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        pointer-events: none;
      }

      /* Overlay gelap tipis di dalam frame supaya teks linktree tetap kebaca jelas */
      .frame-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          180deg,
          rgba(5, 11, 26, 0.55) 0%,
          rgba(5, 11, 26, 0.7) 100%
        );
        z-index: -1;
        pointer-events: none;
      }

      /* === HEADER / LOGO === */
      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: fadeInUp 0.7s ease-out;
      }

      .logo-wrapper {
        margin-bottom: 18px;
        position: relative;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1e3a6f 0%, #0a1f3d 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 0 0 1px rgba(61, 155, 255, 0.3),
          0 8px 32px rgba(61, 155, 255, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .logo-wrapper::before {
        content: "";
        position: absolute;
        inset: -16px;
        background: radial-gradient(
          circle,
          rgba(61, 155, 255, 0.3) 0%,
          transparent 70%
        );
        border-radius: 50%;
        z-index: -1;
        animation: pulse 3s ease-in-out infinite;
      }

      .logo {
        width: 75%;
        height: 75%;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
      }

      .brand-handle {
        font-family: "Syne", "Space Grotesk", sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: var(--text-primary);
        margin-bottom: 6px;
        background: linear-gradient(135deg, #ffffff 0%, #a8c8f0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .brand-tagline {
        font-family: "Space Grotesk", sans-serif;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 24px;
      }

      /* === SOCIAL ICONS ROW === */
      .social-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        margin-bottom: 36px;
        animation: fadeInUp 0.8s ease-out 0.1s backwards;
      }

      .social-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(15, 25, 45, 0.6);
        border: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        font-size: 17px;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .social-icon:hover {
        background: var(--accent-blue);
        border-color: var(--accent-blue);
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(61, 155, 255, 0.35);
      }

      /* === SECTION TITLE === */
      .section-title {
        text-align: center;
        font-family: "Space Grotesk", sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--text-secondary);
        margin: 28px 0 16px;
        position: relative;
        animation: fadeInUp 0.6s ease-out backwards;
      }

      .section-title::before,
      .section-title::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 40px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border-subtle));
      }

      .section-title::before {
        right: calc(50% + 80px);
        background: linear-gradient(90deg, transparent, var(--border-subtle));
      }

      .section-title::after {
        left: calc(50% + 80px);
        background: linear-gradient(90deg, var(--border-subtle), transparent);
      }

      /* === LINK CARDS === */
      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .link-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
        text-decoration: none;
        color: var(--text-primary);
        position: relative;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        animation: fadeInUp 0.6s ease-out backwards;
      }

      .link-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(61, 155, 255, 0.08),
          transparent
        );
        transition: left 0.6s ease;
      }

      .link-card:hover {
        background: var(--bg-card-hover);
        border-color: var(--border-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(61, 155, 255, 0.15);
      }

      .link-card:hover::before {
        left: 100%;
      }

      .link-icon {
        width: 38px;
        height: 38px;
        min-width: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        background: rgba(255, 255, 255, 0.06);
        transition: all 0.3s ease;
      }

      .link-card:hover .link-icon {

      }

      .link-text {

        letter-spacing: 0.2px;
      }

      .link-arrow {
        color: var(--text-muted);
        font-size: 13px;
        transition: all 0.3s ease;
      }

      .link-card:hover .link-arrow {
        color: var(--accent-blue);
        transform: translateX(3px);
      }

      /* === FOOTER === */
      .footer {
        margin-top: 40px;
        text-align: center;
        animation: fadeInUp 0.6s ease-out 0.6s backwards;
      }

      .footer-brand {
        font-family: "Space Grotesk", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }

      .footer-text {
        font-size: 11px;
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      /* === ANIMATIONS === */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.05);
        }
      }

      /* Stagger animation for link cards */
      .link-card:nth-child(1) {
        animation-delay: 0.3s;
      }
      .link-card:nth-child(2) {
        animation-delay: 0.4s;
      }
      .link-card:nth-child(3) {
        animation-delay: 0.5s;
      }

      /* === RESPONSIVE === */
      @media (max-width: 480px) {
        .container {
          padding: 32px 18px 36px;
          margin: 14px 12px;
          border-radius: 24px;
        }

        .logo-wrapper {
          width: 100px;
          height: 100px;
        }

        .brand-handle {
          font-size: 24px;
        }

        .brand-tagline {
          font-size: 12px;
        }

        .social-icon {
          width: 42px;
          height: 42px;
          font-size: 16px;
        }

        .link-card {
          padding: 13px 16px;
        }

        .link-icon {
          width: 36px;
          height: 36px;
          min-width: 36px;
          font-size: 15px;
        }

        .link-text {
          font-size: 14px;
        }

        .section-title::before {
          right: calc(50% + 72px);
          width: 30px;
        }

        .section-title::after {
          left: calc(50% + 72px);
          width: 30px;
        }
      }
    </style>
  </head>

    <script>
      // Force autoplay untuk KEDUA video: background luar + video dalam frame
      (function () {
        const videos = [
          document.getElementById("bgVideo"),
          document.getElementById("frameVideo"),
        ].filter(Boolean);

        if (videos.length === 0) return;

        videos.forEach((video) => {
          video.muted = true;
          video.defaultMuted = true;
          video.playsInline = true;

          const tryPlay = () => {
            const playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.catch(() => {
                // Autoplay diblokir → akan retry saat user interaksi
              });
            }
          };

          video.addEventListener("loadeddata", tryPlay);
          video.addEventListener("canplay", tryPlay);
          if (video.readyState >= 2) tryPlay();
        });

        // Fallback terakhir: play semua video saat user interaksi pertama
        const playAllOnInteraction = () => {
          videos.forEach((v) => v.play().catch(() => {}));
          document.removeEventListener("click", playAllOnInteraction);
          document.removeEventListener("touchstart", playAllOnInteraction);
        };
        document.addEventListener("click", playAllOnInteraction, { passive: true });
        document.addEventListener("touchstart", playAllOnInteraction, { passive: true });
      })();
    </script>
